<main class="sign min-h-dvh bg-[var(--c-bg-primary)] p-4 sm:p-6 lg:p-8">
	<div
		class="mx-auto grid min-h-[calc(100dvh-2rem)] max-w-[1440px] gap-8 lg:min-h-[calc(100dvh-4rem)] lg:grid-cols-2 lg:gap-16"
	>
		<aside
			class="hidden min-w-0 flex-col overflow-hidden rounded-[var(--radius-card)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] lg:flex"
			aria-labelledby="workspace-title"
		>
			<div class="p-10 xl:p-12">
				<h2
					id="workspace-title"
					class="whitespace-nowrap text-3xl font-semibold leading-tight tracking-tight text-[var(--c-text-secondary)] xl:text-4xl"
					translate
				>
					Manage your business
				</h2>
			</div>
			<img
				class="min-h-0 w-full flex-1 object-cover"
				src="/images/workspace.webp"
				width="1536"
				height="1024"
				alt=""
				loading="lazy"
				decoding="async"
			/>
		</aside>
		<section class="flex min-w-0 flex-col justify-center py-6 lg:pr-8" aria-labelledby="sign-title">
			<div class="mx-auto w-full max-w-[420px]">
				<div class="mb-10 flex items-center justify-between gap-6">
					<div class="flex h-12 max-w-48 items-center">
						@if (logo) {
							<img class="max-h-12 max-w-48 object-contain" [src]="logo" alt="Company logo" />
						} @else {
							<icon-spider class="block h-12 w-12" aria-hidden="true"></icon-spider>
						}
					</div>
					<icon-theme class="grid h-11 w-11" size="44px"></icon-theme>
				</div>
				<h1
					id="sign-title"
					class="m-0 text-3xl font-semibold tracking-tight text-[var(--c-text-secondary)]"
					translate
				>
					Sign in to your workspace
				</h1>

				<div class="mt-8" [attr.aria-busy]="isSubmitting()">
					<wbutton
						[disabled]="isSubmitting()"
						(wClick)="signInWithGoogle()"
						type="secondary"
						class="block w-full"
						extraClass="w-full min-h-12 gap-3"
					>
						<svg
							class="h-5 w-5 shrink-0"
							viewBox="0 0 48 48"
							width="20"
							height="20"
							aria-hidden="true"
						>
							<path
								fill="#EA4335"
								d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
							/>
							<path
								fill="#4285F4"
								d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
							/>
							<path
								fill="#FBBC05"
								d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
							/>
							<path
								fill="#34A853"
								d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
							/>
						</svg>
						<span [translate]="isSubmitting() ? 'Please wait…' : 'Continue with Google'"></span>
					</wbutton>
				</div>
			</div>
		</section>
	</div>
</main>
