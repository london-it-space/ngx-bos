<!doctype html>
<html id="html" lang="en" data-startup="always">
	<head>
		<meta charset="utf-8" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="favicon.png" />

		<title>London IT Space</title>
		<meta itemprop="name" content="London IT Space" />
		<meta name="twitter:title" content="London IT Space" />
		<meta property="og:title" content="London IT Space" />

		<meta
			name="description"
			content="An amazing solution to build web or mobile app for your business"
		/>
		<meta
			itemprop="description"
			content="An amazing solution to build web or mobile app for your business"
		/>
		<meta
			name="twitter:description"
			content="An amazing solution to build web or mobile app for your business"
		/>
		<meta
			property="og:description"
			content="An amazing solution to build web or mobile app for your business"
		/>

		<meta
			itemprop="image"
			content="https://bos.londonit.space/logo.png"
		/>
		<meta
			name="twitter:image"
			content="https://bos.londonit.space/logo.png"
		/>
		<meta
			name="twitter:image:src"
			content="https://bos.londonit.space/logo.png"
		/>
		<meta
			property="og:image"
			content="https://bos.londonit.space/logo.png"
		/>

		<!-- Share previews only: BOS is an authenticated SPA, so no canonical/robots here (see tools/seo). -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="London IT Space" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
		<script>
			try {
				const storedMode = localStorage.getItem('theme.mode');
				if (storedMode === 'dark' || storedMode === 'light') {
					document.documentElement.setAttribute('data-mode', storedMode);
				}
			} catch {}
		</script>
		<!-- Startup screen (ngx-ui provideStartup): decide before first paint whether to cover the page. -->
		<script>
			(function () {
				var root = document.documentElement;
				var show = root.getAttribute('data-startup') === 'always';
				if (!show) {
					try {
						// ngx-translate saves the language through the ngx-core store, which prefixes keys
						// with 'waStore' by default (provideNgxCore({ store: { prefix } })).
						var language = localStorage.getItem('waStoretranslate.language');
						var base = root.getAttribute('data-startup-language');
						show = !!language && !!base && language !== base;
					} catch (e) {}
				}
				if (show) {
					root.classList.add('wstartup-pending');
					// Safety net in case the app bundle never starts.
					setTimeout(function () {
						root.classList.remove('wstartup-pending');
					}, 15000);
				}
			})();
		</script>
	</head>

	<body>
		<div id="wstartup" class="wstartup" role="status" aria-live="polite">
			<div class="wstartup__content">
				<img class="wstartup__logo" src="logo.png" alt="" width="64" height="64" />
				<svg class="wstartup__spinner" viewBox="0 0 50 50" aria-hidden="true">
					<circle class="wstartup__track" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
					<circle class="wstartup__arc" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
				</svg>
				<span class="wstartup__label">Loading</span>
			</div>
		</div>
		<app-root></app-root>
	</body>
</html>
